<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Crunched"/>
<meta name="theme-color" content="#060612"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>Crunched</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.1.1/index.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#060612}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;color:#F0F0FF;
  background:
    radial-gradient(ellipse 55% 35% at 10% 10%, rgba(191,90,242,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 45% 30% at 90% 5%, rgba(0,200,255,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 35% at 75% 90%, rgba(255,55,95,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 5% 85%, rgba(10,132,255,0.15) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 50% 50%, rgba(255,159,10,0.08) 0%, transparent 70%),
    #060612;
  background-attachment:scroll;
}
#root{max-width:680px;margin:0 auto}
input,textarea,select{
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-size:16px;color:#F0F0FF;background:#13132A;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:12px 14px;
  width:100%;outline:none;
  -webkit-appearance:none;appearance:none;
  min-height:50px;
}
input:focus,textarea:focus,select:focus{border-color:rgba(255,255,255,0.3);background:#1A1A35}
select option{background:#0D0D20;color:#F0F0FF}
textarea{resize:vertical;min-height:80px}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{font-family:'Space Grotesk',system-ui,sans-serif;cursor:pointer;border:none;background:none;color:#F0F0FF;padding:0;font-size:14px;font-weight:600;-webkit-tap-highlight-color:transparent}
button:active{opacity:0.72}
.btn{border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px 18px;background:#13132A;color:#F0F0FF;transition:background 0.12s;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#1A1A35}
.btn:disabled{opacity:0.25;cursor:not-allowed}
.btn.sm{padding:10px 14px;font-size:13px;border-radius:11px;min-height:42px}
.btn.ghost{background:transparent;border-color:transparent;color:#8080B0}
.btn.ghost:hover{color:#F0F0FF;background:rgba(255,255,255,0.06)}
.btn.dng{color:#FF375F;border-color:rgba(255,55,95,0.25);background:rgba(255,55,95,0.06)}
.btn.dng:hover{background:rgba(255,55,95,0.12)}
.card{background:rgba(10,10,28,0.75);border:1px solid rgba(255,255,255,0.09);border-radius:22px;padding:1.25rem 1.4rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.neon-pink{box-shadow:0 0 16px rgba(255,55,95,0.35),0 0 32px rgba(255,55,95,0.12)}
.neon-cyan{box-shadow:0 0 16px rgba(0,200,255,0.35),0 0 32px rgba(0,200,255,0.12)}
.neon-violet{box-shadow:0 0 16px rgba(191,90,242,0.35),0 0 32px rgba(191,90,242,0.12)}
.neon-blue{box-shadow:0 0 16px rgba(10,132,255,0.3),0 0 32px rgba(10,132,255,0.1)}
.neon-amber{box-shadow:0 0 16px rgba(255,159,10,0.3),0 0 32px rgba(255,159,10,0.1)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:100px;background:#1A1A35;color:#6A6A90;letter-spacing:0.02em}
.lbl{font-size:11px;font-weight:700;color:#7878AA;text-transform:uppercase;letter-spacing:0.10em;display:block;margin-bottom:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#1A1A35;border:none;padding:0;cursor:pointer;min-height:auto}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid #060612}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:3px solid #060612;cursor:pointer}
.stepper-btn{width:50px;height:50px;border-radius:14px;background:#13132A;border:1px solid rgba(255,255,255,0.12);color:#F0F0FF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
:root{--tx:#F0F0FF;--mu:#6060A0;--dim:#1E1E3A;--sf:rgba(10,10,28,0.75);--rz:#13132A;--bdr:rgba(255,255,255,0.09)}
body.light{
  --tx:#0A0A20;--mu:#4A4A90;--dim:#D0D0E8;--sf:rgba(255,255,255,0.88);--rz:#EEEEF8;--bdr:rgba(0,0,20,0.1);
  background:radial-gradient(ellipse 55% 35% at 10% 10%,rgba(191,90,242,0.07) 0%,transparent 70%),radial-gradient(ellipse 45% 30% at 90% 5%,rgba(0,200,255,0.07) 0%,transparent 70%),radial-gradient(ellipse 50% 35% at 75% 90%,rgba(255,55,95,0.07) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 5% 85%,rgba(10,132,255,0.05) 0%,transparent 70%),#F2F2FF;
}
body.light .card{background:rgba(255,255,255,0.88)!important;border-color:rgba(0,0,20,0.08)!important}
body.light input:not([type=range]),body.light textarea,body.light select{background:#F0F0F8!important;color:#0A0A20!important;border-color:rgba(0,0,20,0.15)!important}
body.light .btn{background:#EAEAF4!important;color:#0A0A20!important;border-color:rgba(0,0,20,0.12)!important}
body.light .btn.ghost{background:transparent!important;color:#5050A0!important}
body.light .btn.dng{color:#FF375F!important;background:rgba(255,55,95,0.06)!important;border-color:rgba(255,55,95,0.2)!important}
body.light .pill{background:#E0E0F0!important;color:#5050A0!important}
body.light .stepper-btn{background:#EAEAF4!important;color:#0A0A20!important;border-color:rgba(0,0,20,0.12)!important}
body.light .lbl{color:#5050A0!important}
body.light nav{background:rgba(242,242,255,0.92)!important;border-color:rgba(0,0,20,0.08)!important}
body.light .neon-pink,body.light .neon-cyan,body.light .neon-violet,body.light .neon-blue,body.light .neon-amber{box-shadow:0 4px 16px rgba(0,0,0,0.1)!important}
body.light input[type=range]{background:#D8D8EE!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;

/* ── Vibrant electric palette ── */
const BG='#060612',SF='var(--sf)',RZ='var(--rz)';
const BDR='var(--bdr)';
const TX='var(--tx)',MU='var(--mu)',DIM='var(--dim)';

/* Electric accent colors */
const PINK='#FF375F';
const CYAN='#00C8FF';
const VIOLET='#BF5AF2';
const BLUE='#0A84FF';
const AMBER='#FF9F0A';
const LIME='#32D74B';

/* Text colors on colored backgrounds */
const ON_PINK='#FFFFFF';
const ON_CYAN='#060612';
const ON_VIOLET='#FFFFFF';
const ON_BLUE='#FFFFFF';
const ON_AMBER='#060612';
const ON_LIME='#060612';

const DG={calories:2000,protein:140,carbs:200,fat:65,fibre:30,name:'',theme:'dark',appName:'Crunched',units:'kg'};
const toDisplay=(kg,units)=>units==='lbs'?(Math.round(kg*2.20462*10)/10):kg;
const fromDisplay=(v,units)=>units==='lbs'?(Math.round(v/2.20462*100)/100):v;
const unitLabel=(units)=>units==='lbs'?'lbs':'kg';

const ACTIVITIES=[
  {name:'Walking (slow)',met:2.8},
  {name:'Walking (moderate)',met:3.5},
  {name:'Walking (brisk)',met:4.3},
  {name:'Running (slow)',met:8.0},
  {name:'Running (moderate)',met:10.0},
  {name:'Running (fast)',met:13.5},
  {name:'Cycling (light)',met:4.0},
  {name:'Cycling (moderate)',met:8.0},
  {name:'Cycling (vigorous)',met:12.0},
  {name:'Swimming (light)',met:5.0},
  {name:'Swimming (vigorous)',met:9.8},
  {name:'HIIT',met:8.0},
  {name:'Weight training',met:3.5},
  {name:'Yoga',met:2.5},
  {name:'Pilates',met:3.0},
  {name:'Jump rope',met:12.3},
  {name:'Rowing',met:7.0},
  {name:'Elliptical',met:5.0},
  {name:'Stairmaster',met:9.0},
  {name:'Dancing',met:5.0},
  {name:'Hiking',met:5.3},
  {name:'Football',met:7.0},
  {name:'Basketball',met:6.5},
  {name:'Tennis',met:7.3},
];
const calcBurn=(met,mins,kg)=>Math.round(met*(kg||75)*(mins/60));
const MG=['chest','back','shoulders','biceps','triceps','legs','glutes','core','cardio','full body'];
const tod=()=>new Date().toDateString();
const ds=ts=>new Date(ts).toDateString();
const h=(c,o)=>`${c}${Math.round(o*255).toString(16).padStart(2,'0')}`;
const stor={
  get:k=>{try{const v=localStorage.getItem('fit_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem('fit_'+k,JSON.stringify(v));}catch{}}
};
const AI_URL='/.netlify/functions/estimate';
const resizeImage=(file,maxPx=900)=>new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=e=>{
    const img=new Image();
    img.onerror=reject;
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){if(w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}}
      else{if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        const r2=new FileReader();
        r2.onload=()=>resolve(r2.result.split(',')[1]);
        r2.onerror=reject;
        r2.readAsDataURL(blob);
      },'image/jpeg',0.82);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
});
const validMT=t=>['image/jpeg','image/png','image/gif','image/webp'].includes(t)?t:'image/jpeg';
function calcStreak(foods,workouts,cardio){
  let s=0;
  for(let i=0;i<365;i++){
    const d=new Date();d.setDate(d.getDate()-i);const dt=d.toDateString();
    const active=foods.some(f=>ds(f.ts)===dt)||workouts.some(w=>ds(w.ts)===dt)||(cardio||[]).some(c=>ds(c.ts)===dt);
    if(active)s++;else break;
  }
  return s;
}

function GoalField({label,k,u,mn,mx,st,c,loc,setLoc}){
  const clamp=v=>Math.max(mn,Math.min(mx,v));
  return(
    <div style={{marginBottom:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <label style={{fontSize:14,color:MU,fontWeight:600}}>{label}</label>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <button className="stepper-btn" onClick={()=>setLoc(l=>({...l,[k]:clamp(l[k]-st)}))}>
            <i className="ti ti-minus" style={{fontSize:16}}/>
          </button>
          <input type="number" value={loc[k]} min={mn} max={mx} step={st}
            onChange={e=>{const v=+e.target.value;if(!isNaN(v))setLoc(l=>({...l,[k]:clamp(v)}));}}
            style={{width:88,textAlign:'center',fontSize:18,fontWeight:800,color:c,padding:'10px 4px',minHeight:50}}/>
          <span style={{fontSize:12,color:MU,fontWeight:600,marginLeft:-2,marginRight:2}}>{u}</span>
          <button className="stepper-btn" onClick={()=>setLoc(l=>({...l,[k]:clamp(l[k]+st)}))}>
            <i className="ti ti-plus" style={{fontSize:16}}/>
          </button>
        </div>
      </div>
      <input type="range" min={mn} max={mx} step={st} value={loc[k]} style={{accentColor:c,width:'100%'}} onChange={e=>setLoc(l=>({...l,[k]:+e.target.value}))}/>
    </div>
  );
}

function Ring({consumed,goal,ac}){
  const r=68,cx=86,cy=86,circ=2*Math.PI*r;
  const pct=Math.min(1,consumed/goal),over=consumed>goal,color=over?PINK:ac;
  return(
    <svg width="172" height="172" viewBox="0 0 172 172" style={{display:'block',margin:'0 auto'}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={DIM} strokeWidth="10"/>
      {consumed>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="10"
        strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}/>}
      <text x={cx} y={cx-14} textAnchor="middle" fill={TX} fontSize="36" fontWeight="800" fontFamily="Space Grotesk">{Math.round(consumed)}</text>
      <text x={cx} y={cx+7} textAnchor="middle" fill={MU} fontSize="12" fontFamily="Space Grotesk" fontWeight="600">kcal eaten</text>
      <text x={cx} y={cx+25} textAnchor="middle" fill={color} fontSize="13" fontWeight="700" fontFamily="Space Grotesk">
        {over?`${Math.round(consumed-goal)} over`:`${Math.round(goal-consumed)} to go`}
      </text>
    </svg>
  );
}

function MB({label,val,goal,color}){
  const pct=Math.min(100,Math.round(val/goal*100));
  return(
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:11,fontWeight:700,color:MU,textTransform:'uppercase',letterSpacing:'0.1em'}}>{label}</span>
        <div>
          <span style={{fontSize:18,fontWeight:800,color:TX}}>{Math.round(val)}</span>
          <span style={{fontSize:12,color:MU,fontWeight:500}}>/{goal}g</span>
        </div>
      </div>
      <div style={{height:8,borderRadius:4,background:DIM}}>
        <div style={{height:'100%',borderRadius:4,background:color,width:`${pct}%`,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}

function NG({calories,protein,carbs,fat,fibre}){
  return(
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6,marginBottom:16}}>
      {[['kcal',Math.round(calories),PINK,ON_PINK],['P',Math.round(protein),CYAN,ON_CYAN],['C',Math.round(carbs),BLUE,ON_BLUE],['F',Math.round(fat),AMBER,ON_AMBER],['Fi',Math.round(fibre||0),LIME,ON_LIME]].map(([l,v,bg,tc])=>(
        <div key={l} style={{textAlign:'center',background:bg,borderRadius:12,padding:'9px 0'}}>
          <div style={{fontSize:14,fontWeight:800,color:tc}}>{v}</div>
          <div style={{fontSize:10,color:tc,marginTop:2,fontWeight:700,opacity:0.75}}>{l}</div>
        </div>
      ))}
    </div>
  );
}

function RangeBars({foods,goal,ac,range}){
  const days=Array.from({length:range},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(range-1-i));return d;});
  const grouped=range===7?days.map(d=>({
    lbl:d.toLocaleDateString('en',{weekday:'narrow'}),
    cal:foods.filter(f=>ds(f.ts)===d.toDateString()).reduce((s,f)=>s+f.calories,0),
    now:d.toDateString()===tod()
  })):(()=>{
    const weeks=[];
    for(let i=0;i<days.length;i+=7){
      const chunk=days.slice(i,i+7);
      const cal=chunk.reduce((s,d)=>s+foods.filter(f=>ds(f.ts)===d.toDateString()).reduce((ss,f)=>ss+f.calories,0),0);
      const lbl=chunk[0].toLocaleDateString('en',{day:'numeric',month:'short'});
      weeks.push({lbl,cal,now:chunk.some(d=>d.toDateString()===tod())});
    }
    return weeks;
  })();
  const goalLine=range===7?goal:goal*7;
  const mx=Math.max(goalLine*1.3,...grouped.map(d=>d.cal),1);
  const H=100,n=grouped.length;
  const W=320;
  const bw=Math.max(6,Math.floor((W-8-(n-1)*3)/n));
  const gap=3;
  const totalW=(bw+gap)*n-gap+8;
  // only show label every nth to prevent overlap
  const labelEvery=range===7?1:range===30?2:3;
  return(
    <svg viewBox={`0 0 ${totalW} ${H+22}`} width="100%">
      <line x1="0" y1={H-(goalLine/mx)*H} x2={totalW} y2={H-(goalLine/mx)*H} stroke={ac} strokeWidth="1.5" strokeDasharray="4,3" opacity="0.4"/>
      {grouped.map((d,i)=>{const x=i*(bw+gap)+4,hh=Math.round((d.cal/mx)*H),over=d.cal>goalLine,c=over?PINK:ac;return(
        <g key={i}>
          <rect x={x} y={0} width={bw} height={H} fill={DIM} rx="5"/>
          {d.cal>0&&<rect x={x} y={H-hh} width={bw} height={hh} fill={c} rx="5" opacity={d.now?1:0.5}/>}
          {i%labelEvery===0&&<text x={x+bw/2} y={H+15} textAnchor="middle" fill={d.now?TX:MU} fontSize="11" fontWeight={d.now?'700':'400'}>{d.lbl}</text>}
        </g>
      );})}
    </svg>
  );
}

function WtLine({log,rollingAvg,units}){
  const ul=unitLabel(units||'kg');
  if(log.length<2)return<p style={{color:MU,fontSize:13,textAlign:'center',padding:'1.5rem 0',fontStyle:'italic'}}>log 2+ entries to see your trend</p>;
  const pts=[...log].sort((a,b)=>a.ts-b.ts).slice(-14);
  const ws=pts.map(e=>toDisplay(e.weight,units||'kg')),mn=Math.min(...ws)-0.5,mx=Math.max(...ws)+0.5,W=272,H=80;
  const c=pts.map((e,i)=>({x:(i/(pts.length-1))*(W-16)+8,y:H-((toDisplay(e.weight,units||'kg')-mn)/(mx-mn))*(H-12)-6}));
  const avgPts=(rollingAvg||[]).slice(-14).filter(e=>pts.some(p=>p.ts===e.ts));
  const ac2=avgPts.map((e,i)=>({x:i/(Math.max(1,avgPts.length-1))*(W-16)+8,y:H-((toDisplay(e.weight,units||'kg')-mn)/(mx-mn))*(H-12)-6}));
  return(
    <svg viewBox={`0 0 ${W} ${H+20}`} width="100%">
      {/* raw data - faint */}
      <polyline points={c.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke={BLUE} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.35"/>
      {c.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={2} fill={BLUE} opacity={0.3}/>)}
      {/* rolling average - bold */}
      {ac2.length>1&&<polyline points={ac2.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke={BLUE} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}
      {ac2.length>0&&<circle cx={ac2[ac2.length-1].x} cy={ac2[ac2.length-1].y} r={5} fill={BLUE}/>}
      <text x="8" y={H+16} fill={MU} fontSize="11" fontWeight="600">{new Date(pts[0].ts).toLocaleDateString('en',{day:'numeric',month:'short'})}</text>
      <text x={W-8} y={H+16} fill={MU} fontSize="11" textAnchor="end" fontWeight="600">{new Date(pts[pts.length-1].ts).toLocaleDateString('en',{day:'numeric',month:'short'})}</text>
      {ac2.length>1&&<text x={W/2} y={H+16} fill={BLUE} fontSize="11" textAnchor="middle" fontWeight="600">— 7d avg</text>}
    </svg>
  );
}

function ColorChip({label,value,unit,bg,tc,neon}){
  return(
    <div className={neon} style={{background:bg,borderRadius:18,padding:'14px 8px',textAlign:'center'}}>
      <div style={{fontSize:26,fontWeight:800,color:tc,lineHeight:1}}>{value}</div>
      <div style={{fontSize:10,color:tc,marginTop:4,fontWeight:700,opacity:0.75,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>
      <div style={{fontSize:11,color:tc,fontWeight:600,opacity:0.7,marginTop:1}}>{unit}</div>
    </div>
  );
}

function Onboarding({onComplete}){
  const[name,setName]=useState('');
  const[loc,setLoc]=useState({calories:2000,protein:140,carbs:200,fat:65,fibre:30});
  const flds=[['calories','daily calories','kcal',1000,4000,50,PINK],['protein','protein','g',40,300,5,CYAN],['carbs','carbs','g',50,500,5,BLUE],['fat','fat','g',20,150,5,AMBER],['fibre','fibre','g',10,80,1,LIME]];
  return(
    <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column',justifyContent:'center',padding:'2rem 1.25rem'}}>
      <div style={{marginBottom:'2rem'}}>
        <p style={{fontSize:30,fontWeight:800,color:TX,marginBottom:8}}>welcome 👋</p>
        <p style={{fontSize:15,color:MU,fontWeight:500}}>let's get you set up.</p>
      </div>
      <div className="card" style={{marginBottom:14}}>
        <span className="lbl">your name</span>
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&name.trim()&&onComplete(name.trim(),loc)} autoComplete="given-name" style={{fontSize:18,fontWeight:700}}/>
      </div>

/* ── Rest Timer component ── */
function RestTimer({onClose}){
  const PRESETS=[60,90,120,180];
  const[dur,setDur]=useState(90);
  const[remaining,setRemaining]=useState(null);
  const[running,setRunning]=useState(false);
  const intRef=React.useRef(null);
  const start=d=>{setDur(d);setRemaining(d);setRunning(true);};
  const stop=()=>{setRunning(false);setRemaining(null);clearInterval(intRef.current);};
  useEffect(()=>{
    if(running){
      intRef.current=setInterval(()=>{
        setRemaining(r=>{if(r<=1){clearInterval(intRef.current);setRunning(false);return 0;}return r-1;});
      },1000);
    }
    return()=>clearInterval(intRef.current);
  },[running]);
  const pct=remaining!=null?(remaining/dur)*100:100;
  const mm=Math.floor((remaining??dur)/60);
  const ss=String((remaining??dur)%60).padStart(2,'0');
  const r=54,circ=2*Math.PI*r;
  return(
    <div className="card" style={{borderLeft:`4px solid ${LIME}`,marginBottom:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span className="lbl" style={{marginBottom:0}}>rest timer</span>
        <button className="btn ghost sm" style={{minHeight:36}} onClick={onClose}><i className="ti ti-x" style={{fontSize:14}}/></button>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:16}}>
        <svg width="120" height="120" viewBox="0 0 120 120" style={{flexShrink:0}}>
          <circle cx="60" cy="60" r={r} fill="none" stroke={DIM} strokeWidth="8"/>
          <circle cx="60" cy="60" r={r} fill="none" stroke={remaining===0?PINK:LIME} strokeWidth="8"
            strokeDasharray={`${(pct/100)*circ} ${circ}`} strokeLinecap="round" transform="rotate(-90 60 60)"/>
          <text x="60" y="65" textAnchor="middle" fill={remaining===0?PINK:TX} fontSize="24" fontWeight="800" fontFamily="Space Grotesk">{mm}:{ss}</text>
        </svg>
        <div style={{flex:1}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
            {PRESETS.map(p=>(
              <button key={p} className="btn sm" style={{background:dur===p&&running?LIME:'transparent',color:dur===p&&running?ON_LIME:MU,borderColor:dur===p?LIME:BDR,fontWeight:700,minHeight:40}} onClick={()=>start(p)}>
                {p<60?`${p}s`:`${p/60}m${p%60?p%60+'s':''}`}
              </button>
            ))}
          </div>
          {running?<button className="btn sm" style={{width:'100%',background:PINK,color:ON_PINK,border:'none',fontWeight:800,minHeight:44}} onClick={stop}>stop</button>
          :<button className="btn sm" style={{width:'100%',background:LIME,color:ON_LIME,border:'none',fontWeight:800,minHeight:44}} onClick={()=>start(dur)}>start {dur}s</button>}
        </div>
      </div>
    </div>
  );
}

function OFFSearch({onAdd}){
  const[q,setQ]=useState('');const[load,setLoad]=useState(false);
  const[res,setRes]=useState([]);const[sel,setSel]=useState(null);
  const[qty,setQty]=useState(100);const[err,setErr]=useState('');
  const[scanLoad,setScanLoad]=useState(false);
  const scanRef=React.useRef(null);
  const isBC=s=>/^\d{6,14}$/.test(s.trim());
  const nut=(p,g)=>{const n=p.nutriments||{},f=g/100;return{calories:Math.round((n['energy-kcal_100g']||n['energy-kcal']||0)*f),protein:Math.round((n['proteins_100g']||n.proteins||0)*f*10)/10,carbs:Math.round((n['carbohydrates_100g']||n.carbohydrates||0)*f*10)/10,fat:Math.round((n['fat_100g']||n.fat||0)*f*10)/10,fibre:Math.round((n['fiber_100g']||n['fibers_100g']||0)*f*10)/10};};
  const search=useCallback(async(overrideQ)=>{
    const qry=(overrideQ||q).trim();
    if(!qry)return;setLoad(true);setErr('');setRes([]);setSel(null);
    try{
      if(isBC(qry)){const r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${qry}.json`);const d=await r.json();if(d.status===1&&d.product)setRes([d.product]);else setErr('Barcode not found.');}
      else{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(qry)}&json=1&page_size=8&action=process`);const d=await r.json();const v=(d.products||[]).filter(p=>p.nutriments&&p.product_name).slice(0,6);v.length?setRes(v):setErr('Nothing found. Try a barcode.');}
    }catch{setErr('Could not reach Open Food Facts.');}
    setLoad(false);
  },[q]);

  const scanBarcode=async(file)=>{
    if(!file)return;
    setScanLoad(true);setErr('');
    try{
      const b64=await resizeImage(file,1200);
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:100,
        system:'Look at this image and find any barcode (EAN, UPC, etc). Return ONLY the barcode number as plain digits, nothing else. If no barcode is visible, return the word NONE.',
        messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'What is the barcode number in this image?'}]}]
      })});
      const d=await r.json();
      const code=(d.content?.[0]?.text||'').trim().replace(/\D/g,'');
      if(code.length>=6){setQ(code);search(code);}
      else setErr('No barcode found in image. Try a clearer photo.');
    }catch{setErr('Could not read barcode. Try typing it manually.');}
    setScanLoad(false);
  };

  const doAdd=()=>{if(!sel)return;const n=nut(sel,qty);onAdd({id:Date.now(),ts:Date.now(),source:'off',name:sel.product_name||'Product',serving:`${qty}g`,...n});setQ('');setRes([]);setSel(null);setQty(100);};
  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input value={q} onChange={e=>{setQ(e.target.value);setSel(null);setRes([]);}} onKeyDown={e=>e.key==='Enter'&&search()} placeholder="product name or barcode"/>
        <label style={{flexShrink:0}} title="Scan barcode with camera">
          <div className="btn sm" style={{background:VIOLET,color:ON_VIOLET,border:'none',fontWeight:800,minWidth:50,minHeight:50,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            {scanLoad?<i className="ti ti-loader-2" style={{fontSize:18}}/>:<i className="ti ti-scan" style={{fontSize:18}}/>}
          </div>
          <input ref={scanRef} type="file" accept="image/*" capture="environment" onChange={e=>scanBarcode(e.target.files[0])} style={{display:'none'}}/>
        </label>
        <button className="btn sm" style={{background:BLUE,color:ON_BLUE,border:'none',fontWeight:800,flexShrink:0,minWidth:50,minHeight:50}} onClick={()=>search()} disabled={load||!q.trim()}>{load?<i className="ti ti-loader-2"/>:<i className="ti ti-search"/>}</button>
      </div>
      {err&&<p style={{fontSize:13,color:PINK,marginBottom:10,fontWeight:600}}>{err}</p>}
      {!sel&&res.length>0&&(<div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>
        {res.map((p,i)=>{const n=nut(p,100);return(
          <button key={i} className="btn" style={{textAlign:'left',padding:'12px 14px',minHeight:58}} onClick={()=>setSel(p)}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%'}}>
              <div style={{flex:1,minWidth:0}}><p style={{fontSize:14,color:TX,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.product_name}</p>{p.brands&&<p style={{fontSize:12,color:MU,marginTop:2,fontWeight:500}}>{p.brands}</p>}</div>
              <div style={{display:'flex',gap:6,marginLeft:10,flexShrink:0}}>
                <span style={{background:PINK,color:ON_PINK,borderRadius:100,padding:'3px 10px',fontSize:11,fontWeight:800}}>{n.calories}kcal</span>
              </div>
            </div>
          </button>
        );})}
      </div>)}
      {sel&&(<div style={{background:RZ,borderRadius:16,padding:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div><p style={{fontWeight:800,fontSize:15,color:TX}}>{sel.product_name}</p>{sel.brands&&<p style={{fontSize:12,color:MU,marginTop:2,fontWeight:500}}>{sel.brands}</p>}</div>
          <button className="btn ghost sm" style={{minHeight:44,flexShrink:0}} onClick={()=>setSel(null)}>change</button>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
          <label style={{fontSize:14,color:MU,whiteSpace:'nowrap',fontWeight:600}}>serving</label>
          <input type="number" value={qty} min={1} step={5} inputMode="numeric" onChange={e=>setQty(+e.target.value)} style={{flex:1,textAlign:'center'}}/>
          <span style={{fontSize:14,color:MU,fontWeight:600,flexShrink:0}}>g</span>
        </div>
        <NG {...nut(sel,qty)}/>
        <button className="btn" style={{width:'100%',background:PINK,color:ON_PINK,border:'none',fontWeight:800,minHeight:52}} onClick={doAdd}>add to log</button>
      </div>)}
    </div>
  );
}

function AIEst({onAdd}){

function PhotoEst({onAdd}){
  const[file,setFile]=useState(null);const[preview,setPreview]=useState(null);
  const[load,setLoad]=useState(false);const[res,setRes]=useState(null);const[err,setErr]=useState('');
  const[extraQ,setExtraQ]=useState('');const[extraLoad,setExtraLoad]=useState(false);const[extras,setExtras]=useState([]);const[extraErr,setExtraErr]=useState('');
  const handleFile=e=>{const f=e.target.files[0];if(!f)return;setFile(f);setRes(null);setErr('');setExtras([]);const r=new FileReader();r.onload=()=>setPreview(r.result);r.readAsDataURL(f);};
  const reset=()=>{setFile(null);setPreview(null);setRes(null);setErr('');setExtras([]);setExtraQ('');};
  const addExtra=useCallback(async()=>{
    if(!extraQ.trim())return;setExtraLoad(true);setExtraErr('');
    try{
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:300,system:'You are a nutrition expert. Return ONLY raw JSON, no markdown: {name:string,calories:number,protein:number,carbs:number,fat:number}',messages:[{role:'user',content:extraQ}]})});
      const d=await r.json();
      const ex=JSON.parse((d.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
      setExtras(e=>[...e,{...ex,q:extraQ}]);
      setRes(prev=>({...prev,calories:Math.round(prev.calories+ex.calories),protein:Math.round((prev.protein+ex.protein)*10)/10,carbs:Math.round((prev.carbs+ex.carbs)*10)/10,fat:Math.round((prev.fat+ex.fat)*10)/10,fibre:Math.round(((prev.fibre||0)+(ex.fibre||0))*10)/10}));
      setExtraQ('');
    }catch(e){setExtraErr('Could not estimate. Check your connection.');}
    setExtraLoad(false);
  },[extraQ]);
  const run=async()=>{
    if(!file)return;setLoad(true);setErr('');setRes(null);
    try{
      let b64;
      try{b64=await resizeImage(file);}
      catch(e){setErr('Image processing failed: '+(e.message||'unknown'));setLoad(false);return;}
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,system:'You are a nutrition expert. Analyse this food photo and estimate nutritional content. Return ONLY raw JSON: {name:string,calories:number,protein:number,carbs:number,fat:number,fibre:number,serving:string}.',messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'Estimate the nutritional content of this food.'}]}]})});
      const d=await r.json();
      if(d.error){setErr('API error: '+(d.error.message||d.error.type||JSON.stringify(d.error)));setLoad(false);return;}
      if(!d.content?.[0]?.text){setErr('Unexpected response: '+JSON.stringify(d).slice(0,120));setLoad(false);return;}
      setRes(JSON.parse(d.content[0].text.replace(/```json|```/g,'').trim()));
    }catch(e){setErr('Failed: '+(e.message||'unknown error'));}
    setLoad(false);
  };
  const doAdd=()=>{if(!res)return;onAdd({id:Date.now(),ts:Date.now(),source:'photo',...res});reset();};
  return(
    <div>
      {!preview?(
        <label style={{display:'block',cursor:'pointer'}}>
          <div style={{border:`2px dashed ${h(CYAN,0.4)}`,borderRadius:16,padding:'2.5rem 1rem',textAlign:'center',background:h(CYAN,0.06)}}>
            <i className="ti ti-camera" style={{fontSize:42,color:CYAN,display:'block',marginBottom:10}}/>
            <p style={{fontSize:15,color:MU,fontWeight:600}}>tap to upload or take a photo</p>
            <p style={{fontSize:12,color:MU,marginTop:5,fontWeight:500}}>works best with a clear shot of the plate</p>
          </div>
          <input type="file" accept="image/*" onChange={handleFile} style={{display:'none'}}/>
        </label>
      ):(
        <div>
          <div style={{position:'relative',marginBottom:12}}>
            <img src={preview} alt="food" style={{width:'100%',borderRadius:16,maxHeight:240,objectFit:'cover',display:'block'}}/>
            <button onClick={reset} style={{position:'absolute',top:10,right:10,background:'rgba(6,6,18,0.88)',border:'none',color:TX,borderRadius:12,padding:'8px 14px',fontSize:13,fontWeight:700,minHeight:40}}>
              <i className="ti ti-refresh" style={{marginRight:5,fontSize:13,verticalAlign:-1}}/>retake
            </button>
          </div>
          {!res&&(<button className="btn" style={{width:'100%',background:CYAN,color:ON_CYAN,border:'none',fontWeight:800,minHeight:52}} onClick={run} disabled={load}>
            {load?<><i className="ti ti-loader-2" style={{marginRight:6}}/>analysing...</>:<><i className="ti ti-sparkles" style={{marginRight:6,fontSize:15,verticalAlign:-2}}/>analyse photo</>}
          </button>)}
        </div>
      )}
      {err&&<p style={{fontSize:13,color:PINK,marginTop:12,fontWeight:600}}>{err}</p>}
      {res&&(<div style={{marginTop:14,background:RZ,borderRadius:16,padding:'16px'}}>
        <p style={{fontSize:11,color:MU,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:'0.08em'}}>looks right? adjust anything before adding</p>
        <input value={res.name} onChange={e=>setRes({...res,name:e.target.value})} style={{marginBottom:8,fontWeight:700,fontSize:15}}/>
        <input value={res.serving} onChange={e=>setRes({...res,serving:e.target.value})} placeholder="serving description" style={{marginBottom:14,fontSize:13}}/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6,marginBottom:14}}>
          {[['kcal','calories',PINK,ON_PINK],['P','protein',CYAN,ON_CYAN],['C','carbs',BLUE,ON_BLUE],['F','fat',AMBER,ON_AMBER],['Fi','fibre',LIME,ON_LIME]].map(([l,k,bg,tc])=>(
            <div key={k} style={{textAlign:'center',background:bg,borderRadius:12,padding:'8px 4px'}}>
              <input type="number" value={res[k]} min={0} inputMode="numeric"
                onChange={e=>setRes({...res,[k]:Math.max(0,+e.target.value)})}
                style={{background:'transparent',border:'none',borderRadius:0,textAlign:'center',fontSize:17,fontWeight:800,color:tc,padding:'0',minHeight:'auto',width:'100%',boxShadow:'none'}}/>
              <div style={{fontSize:11,color:tc,fontWeight:700,opacity:0.75,marginTop:1}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{borderTop:`1px solid ${BDR}`,paddingTop:12,marginBottom:14}}>
          <p style={{fontSize:11,color:MU,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:'0.07em'}}>anything missing?</p>
          <div style={{display:'flex',gap:8}}>
            <input value={extraQ} onChange={e=>setExtraQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addExtra()} placeholder="e.g. tbsp olive oil, yoghurt dressing" style={{flex:1}}/>
            <button className="btn sm" style={{background:VIOLET,color:ON_VIOLET,border:'none',fontWeight:800,minHeight:48,flexShrink:0,padding:'10px 16px'}} onClick={addExtra} disabled={extraLoad||!extraQ.trim()}>
              {extraLoad?<i className="ti ti-loader-2" style={{fontSize:14}}/>:<i className="ti ti-plus" style={{fontSize:16}}/>}
            </button>
          </div>
          {extraErr&&<p style={{fontSize:12,color:PINK,marginTop:8,fontWeight:600}}>{extraErr}</p>}
          {extras.length>0&&(
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:5}}>
              {extras.map((ex,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12}}>
                  <span style={{color:MU,fontWeight:600}}>+ {ex.name||ex.q}</span>
                  <span style={{color:PINK,fontWeight:800}}>{ex.calories} kcal</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn" style={{flex:1,background:PINK,color:ON_PINK,border:'none',fontWeight:800,minHeight:52}} onClick={doAdd}>add to log</button>
          <button className="btn sm ghost" style={{minHeight:52,padding:'10px 16px'}} onClick={reset}>retake</button>
        </div>
      </div>)}
    </div>
  );
}

  const MODES=[['product','ti-barcode','product',BLUE,ON_BLUE],['describe','ti-align-left','describe',PINK,ON_PINK],['photo','ti-camera','photo',CYAN,ON_CYAN]];

  const copyYesterday=()=>setFoods(prev=>[...prev,...yFoods.map(f=>({...f,id:Date.now()+Math.random(),ts:Date.now()}))]);
  const todayNames=new Set(tf.map(f=>f.name));
  const recent=[...foods].filter(f=>ds(f.ts)!==tod()).sort((a,b)=>b.ts-a.ts).filter((f,i,arr)=>arr.findIndex(x=>x.name===f.name)===i).filter(f=>!todayNames.has(f.name)).slice(0,6);
  const quickAdd=f=>onAdd({...f,id:Date.now()+Math.random(),ts:Date.now()});
  const saveMeal=item=>{setSavedMeals(s=>[...s,{...item,id:Date.now(),savedAt:Date.now(),name:saveName||item.name}]);setSaveModal(null);setSaveName('');};

    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {/* save meal modal */}
      {saveModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(6,6,18,0.92)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
          <div className="card" style={{width:'100%',maxWidth:380}}>
            <p style={{fontSize:16,fontWeight:800,color:TX,marginBottom:14}}>save as meal</p>
            <input value={saveName} onChange={e=>setSaveName(e.target.value)} placeholder={saveModal.name} style={{marginBottom:14}}/>
            <div style={{display:'flex',gap:10}}>
              <button className="btn sm" style={{flex:1,background:AMBER,color:ON_AMBER,border:'none',fontWeight:800,minHeight:48}} onClick={()=>saveMeal(saveModal)}>save</button>
              <button className="btn sm ghost" style={{flex:1,minHeight:48}} onClick={()=>setSaveModal(null)}>cancel</button>
            </div>
          </div>
        </div>
      )}
      {/* 1 - logging card: always first */}
      <div className="card" style={{borderLeft:`4px solid ${PINK}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span style={{fontSize:12,color:MU,fontWeight:600}}>logging as</span>
          {/* meal category with scroll fade */}
          <div style={{position:'relative',overflow:'hidden'}}>
            <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2,WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}}>
              {MEAL_CATS.map(c=>(
                <button key={c} onClick={()=>setMealCat(c)} style={{flexShrink:0,padding:'6px 12px',fontSize:12,border:`1px solid ${mealCat===c?catColors[c]:BDR}`,background:mealCat===c?h(catColors[c],0.15):'transparent',borderRadius:100,color:mealCat===c?catColors[c]:MU,fontWeight:mealCat===c?800:500,minHeight:36,transition:'all 0.15s'}}>
                  {c}
                </button>
              ))}
            </div>
            <div style={{position:'absolute',right:0,top:0,bottom:0,width:24,background:'linear-gradient(to right,transparent,var(--sf))',pointerEvents:'none'}}/>
          </div>
        </div>
        <div style={{display:'flex',gap:0,marginBottom:14,background:RZ,borderRadius:14,padding:4}}>
          {MODES.map(([m,ic,lb,c,tc])=>(
            <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:'10px 4px',fontSize:13,border:'none',background:mode===m?c:'transparent',borderRadius:11,color:mode===m?tc:MU,fontWeight:mode===m?800:500,transition:'all 0.15s',minHeight:48,letterSpacing:mode===m?'0.01em':'normal'}}>
              <i className={`ti ${ic}`} style={{marginRight:4,fontSize:14,verticalAlign:-2}}/>{lb}
            </button>
          ))}
        </div>
        {mode==='product'&&<OFFSearch onAdd={onAdd}/>}
        {mode==='describe'&&<AIEst onAdd={onAdd}/>}
        {mode==='photo'&&<PhotoEst onAdd={onAdd}/>}
      </div>
      {/* 2 - today's log */}
      {tf.length>0&&(
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <span className="lbl" style={{marginBottom:0}}>today</span>
            <div style={{display:'flex',gap:12}}>
              <span style={{fontSize:14,fontWeight:800,color:PINK}}>{Math.round(tot.cal)}<span style={{color:MU,fontWeight:500,fontSize:12}}> kcal</span></span>
              <span style={{fontSize:14,fontWeight:800,color:CYAN}}>{Math.round(tot.pro)}<span style={{color:MU,fontWeight:500,fontSize:12}}>g P</span></span>
            </div>
          </div>
          {MEAL_CATS.map(cat=>{
            const catFoods=tf.filter(f=>(f.meal||'breakfast')===cat);
            if(!catFoods.length)return null;
            const catCal=catFoods.reduce((s,f)=>s+f.calories,0);
            const c=catColors[cat];
            return(
              <div key={cat} style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{fontSize:12,fontWeight:800,color:c,textTransform:'uppercase',letterSpacing:'0.08em'}}>{cat}</span>
                  <span style={{fontSize:12,fontWeight:700,color:MU}}>{Math.round(catCal)} kcal</span>
                </div>
                {catFoods.map(f=>(
                  <div key={f.id}>
                    <FoodEntry f={f} onDelete={onDelete} onEdit={onEdit} onSave={()=>{setSaveModal(f);setSaveName(f.name);}}/>

                ))}
              </div>
            );
          })}
        </div>
      )}
      {/* 3 - recently logged */}
      {recent.length>0&&(
        <div className="card">
          <span className="lbl">recently logged</span>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {recent.map((f,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:`1px solid ${BDR}`,paddingBottom:8}}>
                <div style={{flex:1,minWidth:0,marginRight:10}}>
                  <p style={{fontSize:14,fontWeight:700,color:TX,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</p>
                  <p style={{fontSize:11,color:MU,fontWeight:500}}>{f.serving} · {Math.round(f.calories)} kcal · {Math.round(f.protein)}g P</p>
                </div>
                <button className="btn sm" style={{background:PINK,color:ON_PINK,border:'none',fontWeight:800,minHeight:40,flexShrink:0}} onClick={()=>quickAdd(f)}>
                  <i className="ti ti-plus" style={{fontSize:14}}/>
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
      {/* 4 - saved meals */}
      {savedMeals.length>0&&(
        <div>
          <button className="btn ghost sm" style={{color:AMBER,minHeight:44}} onClick={()=>setShowSaved(s=>!s)}>
            <i className="ti ti-star" style={{fontSize:14,verticalAlign:-2}}/>{showSaved?'hide saved meals':'saved meals'}
          </button>
          {showSaved&&(
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
              {savedMeals.map(m=>(
                <div key={m.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:SF,border:`1px solid ${BDR}`,borderRadius:14,padding:'10px 14px',borderLeft:`3px solid ${AMBER}`}}>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontSize:14,fontWeight:700,color:TX,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</p>
                    <p style={{fontSize:11,color:MU,fontWeight:500}}>{Math.round(m.calories)} kcal · {Math.round(m.protein)}g P</p>
                  </div>
                  <div style={{display:'flex',gap:6,marginLeft:10}}>
                    <button className="btn sm" style={{background:AMBER,color:ON_AMBER,border:'none',fontWeight:800,minHeight:40}} onClick={()=>quickAdd(m)}><i className="ti ti-plus" style={{fontSize:14}}/></button>
                    <button className="btn sm dng" style={{minHeight:40}} onClick={()=>setSavedMeals(s=>s.filter(x=>x.id!==m.id))}><i className="ti ti-x" style={{fontSize:13}}/></button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {/* 5 - copy yesterday */}
      {canCopy&&(
        <button className="btn" style={{border:`1px solid ${h(CYAN,0.35)}`,color:CYAN,background:h(CYAN,0.08),borderRadius:16,padding:'14px 16px',textAlign:'left',fontWeight:700,minHeight:54}} onClick={copyYesterday}>
          <i className="ti ti-copy" style={{marginRight:8,fontSize:16,verticalAlign:-2}}/>copy yesterday's log ({yFoods.length} item{yFoods.length!==1?'s':''})
        </button>

    </div>
  );
}

function ProgressTab({foods,workouts,weightLog,goals,ac}){
  const[range,setRange]=useState(7);
  const units=goals.units||'kg';
  const ul=unitLabel(units);
  const wk=workouts.filter(w=>(Date.now()-w.ts)/864e5<=range);
  const dLog=new Set(foods.filter(f=>(Date.now()-f.ts)/864e5<=range).map(f=>ds(f.ts))).size;
  const sw=[...weightLog].sort((a,b)=>b.ts-a.ts);
  const lw=sw[0]?.weight,fw=[...weightLog].sort((a,b)=>a.ts-b.ts)[0]?.weight;
  const lwD=lw?toDisplay(lw,units):null;
  const deltaKg=lw&&fw?(lw-fw):null;
  const deltaD=deltaKg!=null?(toDisplay(Math.abs(deltaKg),units)*(deltaKg<0?-1:1)).toFixed(1):null;
  const trend=deltaD!=null?parseFloat(deltaD):null;
  const avgCal=range>7?(()=>{
    const days=[...new Set(foods.filter(f=>(Date.now()-f.ts)/864e5<=range).map(f=>ds(f.ts)))];
    if(!days.length)return 0;
    const total=foods.filter(f=>(Date.now()-f.ts)/864e5<=range).reduce((s,f)=>s+f.calories,0);
    return Math.round(total/days.length);
  })():null;
  const rangeLabel={7:'last 7 days',30:'last 30 days',90:'last 90 days'}[range];

  /* macro adherence - days hitting each goal */
  const adherenceDays=[...new Set(foods.filter(f=>(Date.now()-f.ts)/864e5<=7).map(f=>ds(f.ts)))];
  const adherence=['protein','carbs','fat','fibre'].map(k=>{
    const goal=goals[k]||1;
    const days=adherenceDays.filter(d=>{
      const total=foods.filter(f=>ds(f.ts)===d).reduce((s,f)=>s+(f[k]||0),0);
      return total>=goal*0.9;
    });
    return{k,days:days.length,total:adherenceDays.length};
  });

  /* volume by muscle group - last 7 days */
  const muscleVol=(()=>{
    const wk7=workouts.filter(w=>(Date.now()-w.ts)/864e5<=7);
    const vol={};
    wk7.forEach(w=>{vol[w.muscle]=(vol[w.muscle]||0)+w.sets.length;});
    return Object.entries(vol).sort((a,b)=>b[1]-a[1]);
  })();
  const maxVol=Math.max(1,...muscleVol.map(([,v])=>v));

  /* rolling 7-day average for weight */
  const rollingAvg=(()=>{
    const pts=[...weightLog].sort((a,b)=>a.ts-b.ts);
    return pts.map((e,i)=>{
      const window=pts.slice(Math.max(0,i-6),i+1);
      return{ts:e.ts,weight:window.reduce((s,x)=>s+x.weight,0)/window.length};
    });
  })();

  const adherenceColors={protein:CYAN,carbs:BLUE,fat:AMBER,fibre:LIME};

  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',gap:0,background:'var(--rz)',borderRadius:14,padding:4}}>
        {[7,30,90].map(r=>(
          <button key={r} onClick={()=>setRange(r)} style={{flex:1,padding:'10px 4px',fontSize:13,border:'none',background:range===r?CYAN:'transparent',borderRadius:11,color:range===r?ON_CYAN:MU,fontWeight:range===r?800:500,transition:'all 0.15s',minHeight:44}}>
            {r}d
          </button>
        ))}
      </div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span className="lbl" style={{marginBottom:0}}>calories · {rangeLabel}</span>
          <span style={{fontSize:11,color:DIM,fontWeight:600}}>-- = goal</span>
        </div>
        <RangeBars foods={foods} goal={goals.calories} ac={ac} range={range}/>
        {avgCal!==null&&(
          <div style={{marginTop:12,display:'flex',justifyContent:'space-between',fontSize:13}}>
            <span style={{color:MU,fontWeight:600}}>daily average</span>
            <span style={{color:avgCal>goals.calories?PINK:LIME,fontWeight:800}}>{avgCal} kcal</span>
          </div>
        )}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <ColorChip label="training sessions" value={wk.length} unit={rangeLabel} bg={VIOLET} tc={ON_VIOLET} neon="neon-violet"/>
        <ColorChip label="days logged" value={dLog} unit={rangeLabel} bg={BLUE} tc={ON_BLUE} neon="neon-blue"/>
      </div>
      {/* macro adherence */}
      {adherenceDays.length>0&&(
        <div className="card">
          <span className="lbl">macro adherence · last 7 days</span>
          {adherence.map(({k,days,total})=>(
            <div key={k} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:13,color:MU,fontWeight:600,textTransform:'capitalize'}}>{k}</span>
                <span style={{fontSize:13,fontWeight:800,color:days>=total*0.8?LIME:days>=total*0.5?AMBER:PINK}}>{days}/{total} days</span>
              </div>
              <div style={{height:6,borderRadius:3,background:DIM}}>
                <div style={{height:'100%',borderRadius:3,background:adherenceColors[k],width:`${total?Math.round(days/total*100):0}%`,transition:'width 0.4s'}}/>
              </div>
            </div>
          ))}
        </div>
      )}
      {/* volume by muscle group */}
      {muscleVol.length>0&&(
        <div className="card">
          <span className="lbl">sets by muscle · last 7 days</span>
          {muscleVol.map(([muscle,sets])=>(
            <div key={muscle} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:13,color:MU,fontWeight:600,textTransform:'capitalize'}}>{muscle}</span>
                <span style={{fontSize:13,fontWeight:800,color:VIOLET}}>{sets} sets</span>
              </div>
              <div style={{height:8,borderRadius:4,background:DIM}}>
                <div style={{height:'100%',borderRadius:4,background:VIOLET,width:`${Math.round(sets/maxVol*100)}%`,opacity:0.8}}/>
              </div>
            </div>
          ))}
        </div>
      )}
      <div className="card" style={{borderLeft:`4px solid ${BLUE}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span className="lbl" style={{marginBottom:0}}>weight trend</span>
          {lwD&&<span style={{fontSize:17,fontWeight:800,color:TX}}>{lwD}{ul}{trend!=null&&<span style={{fontSize:14,marginLeft:8,color:trend>0?PINK:LIME,fontWeight:800}}>{trend>0?'+':''}{deltaD}{ul}</span>}</span>}
        </div>
        <WtLine log={weightLog} rollingAvg={rollingAvg} units={units}/>
        {weightLog.length>0&&(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginTop:14}}>
            {[['highest',toDisplay(Math.max(...weightLog.map(e=>e.weight)),units)+ul,PINK,ON_PINK],['lowest',toDisplay(Math.min(...weightLog.map(e=>e.weight)),units)+ul,LIME,ON_LIME],['entries',weightLog.length,RZ,TX]].map(([l,v,bg,tc])=>(
              <div key={l} style={{textAlign:'center',background:bg,border:bg===RZ?`1px solid ${BDR}`:'none',borderRadius:14,padding:'12px 0'}}>
                <div style={{fontSize:17,fontWeight:800,color:tc}}>{v}</div>
                <div style={{fontSize:11,color:tc,fontWeight:700,opacity:bg===RZ?0.5:0.75,marginTop:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{l}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function TDEECalc({loc,setLoc,units}){
  const isLbs=units==='lbs';
  const[sex,setSex]=useState('female');
  const[age,setAge]=useState(30);
  const[heightVal,setHeightVal]=useState(isLbs?65:165); // inches or cm
  const[weightVal,setWeightVal]=useState(isLbs?143:65); // lbs or kg
  const[activity,setActivity]=useState(1.375);
  const[result,setResult]=useState(null);
  const calc=()=>{
    const kg=isLbs?weightVal/2.20462:weightVal;
    const cm=isLbs?heightVal*2.54:heightVal;
    const bmr=sex==='male'?(10*kg)+(6.25*cm)-(5*age)+5:(10*kg)+(6.25*cm)-(5*age)-161;
    const tdee=Math.round(bmr*activity);
    setResult({tdee,cut:tdee-400,bulk:tdee+300});
  };
  const acts=[['sedentary (desk job)',1.2],['light (1-3x/week)',1.375],['moderate (3-5x/week)',1.55],['active (6-7x/week)',1.725],['very active (2x/day)',1.9]];
  const hu=isLbs?'in':'cm';const wu=isLbs?'lbs':'kg';
  const hMn=isLbs?55:140;const hMx=isLbs?84:220;
  const wMn=isLbs?88:40;const wMx=isLbs?440:200;
  return(
    <div>
      <p style={{fontSize:13,color:MU,fontWeight:500,marginBottom:14,lineHeight:1.6}}>Don't know your calorie target? Calculate it from your stats.</p>
      <div style={{display:'flex',gap:0,background:'var(--rz)',borderRadius:12,padding:3,marginBottom:14}}>
        {[['female','F'],['male','M']].map(([v,l])=>(
          <button key={v} onClick={()=>setSex(v)} style={{flex:1,padding:'10px',fontSize:14,border:'none',background:sex===v?PINK:'transparent',borderRadius:10,color:sex===v?ON_PINK:MU,fontWeight:sex===v?800:500,minHeight:44}}>{l}</button>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
        {[['age','yrs',18,80,1,age,setAge,AMBER],[`height`,hu,hMn,hMx,1,heightVal,setHeightVal,CYAN],[`weight`,wu,wMn,wMx,1,weightVal,setWeightVal,LIME]].map(([lb,u,mn,mx,st,val,set,c])=>(
          <div key={lb}>
            <label style={{fontSize:11,color:c,fontWeight:700,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:'0.05em'}}>{lb} ({u})</label>
            <input type="number" value={val} min={mn} max={mx} step={st} inputMode="numeric" onChange={e=>set(Math.max(mn,Math.min(mx,+e.target.value)))} style={{textAlign:'center',fontWeight:700}}/>
          </div>
        ))}
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:12,color:MU,fontWeight:600,display:'block',marginBottom:7}}>activity level</label>
        <select value={activity} onChange={e=>setActivity(+e.target.value)}>{acts.map(([l,v])=><option key={v} value={v}>{l}</option>)}</select>
      </div>
      <button className="btn" style={{width:'100%',background:PINK,color:ON_PINK,border:'none',fontWeight:800,minHeight:50,marginBottom:result?14:0}} onClick={calc}>calculate</button>
      {result&&(
        <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
            {[['cut',result.cut,BLUE,ON_BLUE],['maintain',result.tdee,LIME,ON_LIME],['bulk',result.bulk,AMBER,ON_AMBER]].map(([l,v,bg,tc])=>(
              <button key={l} onClick={()=>setLoc(lo=>({...lo,calories:v}))} style={{background:bg,borderRadius:14,padding:'12px 6px',textAlign:'center',border:'none',cursor:'pointer'}}>
                <div style={{fontSize:17,fontWeight:800,color:tc}}>{v}</div>
                <div style={{fontSize:10,color:tc,fontWeight:700,opacity:0.75,marginTop:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{l}</div>
              </button>
            ))}
          </div>
          <p style={{fontSize:11,color:MU,textAlign:'center',marginTop:8,fontWeight:500}}>tap a goal to apply it</p>
        </>
      )}
    </div>
  );
}

        <span className="lbl">units</span>
        <div style={{display:'flex',gap:0,background:'var(--rz)',borderRadius:14,padding:4}}>
          {[['kg','kg'],['lbs','lbs']].map(([val,lbl])=>(
            <button key={val} onClick={()=>setLoc(l=>({...l,units:val}))} style={{
              flex:1,padding:'12px 4px',fontSize:14,border:'none',
              background:(loc.units||'kg')===val?VIOLET:'transparent',
              borderRadius:11,color:(loc.units||'kg')===val?ON_VIOLET:MU,
              fontWeight:(loc.units||'kg')===val?800:500,transition:'all 0.18s',minHeight:50
            }}>{lbl}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <span className="lbl">TDEE calculator</span>
        <p style={{fontSize:13,color:MU,fontWeight:500,marginBottom:14,lineHeight:1.6}}>Don't know your calorie target? Calculate it from your stats.</p>
        <TDEECalc loc={loc} setLoc={setLoc} units={goals.units||'kg'}/>
      </div>
      <div className="card">
        <span className="lbl">daily targets</span>
        {flds.map(([k,lb,u,mn,mx,st,c])=><GoalField key={k} label={lb} k={k} u={u} mn={mn} mx={mx} st={st} c={c} loc={loc} setLoc={setLoc}/>)}
        <button className="btn" style={{width:'100%',background:CYAN,color:ON_CYAN,border:'none',fontWeight:800,minHeight:54,fontSize:16}} onClick={save}>
          {ok?<><i className="ti ti-check" style={{marginRight:6}}/>saved!</>:'save changes'}
        </button>
      </div>
      <div className="card">
        <span className="lbl">data</span>
        <p style={{fontSize:13,color:MU,fontWeight:500,marginBottom:14,lineHeight:1.7}}>Export all your data as a JSON file. Keep it as a backup or import it elsewhere.</p>
        <button className="btn" style={{width:'100%',minHeight:50,fontWeight:700,marginBottom:12}} onClick={()=>{
          const data={foods:JSON.parse(localStorage.getItem('fit_foods')||'[]'),workouts:JSON.parse(localStorage.getItem('fit_workouts')||'[]'),weightLog:JSON.parse(localStorage.getItem('fit_wt')||'[]'),cardio:JSON.parse(localStorage.getItem('fit_cardio')||'[]'),goals:JSON.parse(localStorage.getItem('fit_goals')||'{}')};
          const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`crunched-export-${new Date().toISOString().slice(0,10)}.json`;a.click();
        }}>
          <i className="ti ti-download" style={{marginRight:8,fontSize:16,verticalAlign:-2}}/>export data
        </button>
        <p style={{fontSize:13,color:MU,fontWeight:500,lineHeight:1.7}}>
          <i className="ti ti-device-mobile" style={{marginRight:6,fontSize:14,verticalAlign:-2,color:CYAN}}/>
          <span style={{color:CYAN,fontWeight:700}}>tip:</span> open Crunched in Safari and tap Share → Add to Home Screen for the full app experience.
        </p>
      </div>
      <div className="card">
        <span className="lbl">about</span>
        <p style={{fontSize:14,color:MU,lineHeight:1.8,fontWeight:500}}>Food data: <span style={{color:CYAN,fontWeight:700}}>Open Food Facts</span> (open source, free). AI estimates and photo analysis: <span style={{color:VIOLET,fontWeight:700}}>Claude Sonnet</span>. Your data saves locally to your device.</p>
      </div>
    </div>
  );
}

function App(){
  const[tab,setTab]=useState('home');const[rdy,setRdy]=useState(false);
  const[foods,setFoods]=useState([]);const[workouts,setWorkouts]=useState([]);
  const[weightLog,setWeightLog]=useState([]);const[templates,setTemplates]=useState([]);
  const[goals,setGoals]=useState(DG);const[cardio,setCardio]=useState([]);
  const[savedMeals,setSavedMeals]=useState([]);
  useEffect(()=>{
    const f=stor.get('foods'),w=stor.get('workouts'),wl=stor.get('wt'),t=stor.get('tpls'),g=stor.get('goals'),c=stor.get('cardio'),sm=stor.get('savedMeals');
    if(f)setFoods(f);if(w)setWorkouts(w);if(wl)setWeightLog(wl);if(t)setTemplates(t);if(g)setGoals(g);if(c)setCardio(c);if(sm)setSavedMeals(sm);
    setRdy(true);
  },[]);
  useEffect(()=>{if(rdy)stor.set('foods',foods);},[foods,rdy]);
  useEffect(()=>{if(rdy)stor.set('workouts',workouts);},[workouts,rdy]);
  useEffect(()=>{if(rdy)stor.set('wt',weightLog);},[weightLog,rdy]);
  useEffect(()=>{if(rdy)stor.set('tpls',templates);},[templates,rdy]);
  useEffect(()=>{if(rdy)stor.set('goals',goals);},[goals,rdy]);
  useEffect(()=>{if(rdy)stor.set('cardio',cardio);},[cardio,rdy]);
  useEffect(()=>{if(rdy)stor.set('savedMeals',savedMeals);},[savedMeals,rdy]);

  const ac=CYAN;
  const streak=calcStreak(foods,workouts,cardio);
  const[toast,setToast]=useState(null);
  const prevStreak=React.useRef(streak);
  useEffect(()=>{
    if(!rdy)return;
    const milestones=[3,7,14,30,60,90];
    if(streak!==prevStreak.current&&milestones.includes(streak)){
      setToast({emoji:'🔥',msg:`${streak} day streak!`,sub:'Keep it going'});
      setTimeout(()=>setToast(null),3500);
    }
    prevStreak.current=streak;
  },[streak,rdy]);
  const appName=goals.appName||'Crunched';
  const isDark=goals.theme!=='light';

  useEffect(()=>{
    document.body.classList.toggle('light',!isDark);
    return()=>document.body.classList.remove('light');
  },[isDark]);

  /* nav: each tab has its own electric color */
  const NAV=[
    ['home','ti-layout-dashboard',ac],
    ['train','ti-barbell',VIOLET],
    ['cardio','ti-run',LIME],
    ['food','ti-salad',PINK],
    ['progress','ti-chart-line',BLUE],
    ['settings','ti-settings',AMBER]
  ];

  if(!rdy)return<div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><p style={{color:MU,fontSize:15,fontWeight:600}}>loading...</p></div>;
  if(!goals.name)return<Onboarding onComplete={(name,newGoals)=>setGoals(g=>({...g,...newGoals,name}))}/>;

  /* weekly summary card data */
  const weekFoods=foods.filter(f=>(Date.now()-f.ts)/864e5<=7);
  const weekWorkouts=workouts.filter(w=>(Date.now()-w.ts)/864e5<=7);
  const weekDaysLogged=new Set(weekFoods.map(f=>ds(f.ts))).size;
  const weekAvgCal=weekDaysLogged?Math.round(weekFoods.reduce((s,f)=>s+f.calories,0)/weekDaysLogged):0;

  return(
    <div style={{background:BG,minHeight:'100vh'}}>
      {/* achievement toast */}
      {toast&&(
        <div style={{position:'fixed',top:20,left:'50%',transform:'translateX(-50%)',zIndex:200,background:h(LIME,0.95),border:`1px solid ${LIME}`,borderRadius:16,padding:'12px 20px',textAlign:'center',boxShadow:`0 0 30px ${LIME}55`,minWidth:200,animation:'fadeIn 0.3s ease'}}>
          <p style={{fontSize:22,marginBottom:2}}>{toast.emoji}</p>
          <p style={{fontSize:15,fontWeight:800,color:'#060612'}}>{toast.msg}</p>
          <p style={{fontSize:12,color:'#060612',opacity:0.7,fontWeight:600}}>{toast.sub}</p>
        </div>
      )}
      <nav style={{position:'sticky',top:0,zIndex:10,background:'rgba(6,6,18,0.85)',backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',borderBottom:`1px solid rgba(255,255,255,0.08)`,padding:'6px 0 4px'}}>
        <p style={{textAlign:'center',fontSize:11,fontWeight:800,color:MU,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:6}}>{appName}</p>
        <div style={{display:'flex',justifyContent:'space-around',maxWidth:680,margin:'0 auto'}}>
          {NAV.map(([id,ic,color])=>(
            <button key={id} onClick={()=>setTab(id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:1,color:tab===id?color:MU,padding:'2px 8px',minWidth:58,minHeight:52}}>
              <div style={{padding:'6px 14px',borderRadius:14,background:tab===id?color:'transparent',boxShadow:tab===id?`0 0 16px ${color}88`:'none',transition:'all 0.18s'}}>
                <i className={`ti ${ic}`} style={{fontSize:21,display:'block',color:tab===id?'#060612':MU}}/>
              </div>
              <span style={{fontSize:10,fontWeight:tab===id?800:500,letterSpacing:'0.03em',color:tab===id?color:MU}}>{id}</span>
            </button>
          ))}
        </div>
      </nav>
      <div style={{maxWidth:680,margin:'0 auto',padding:'1rem 1rem 5rem'}}>
        {tab==='home'&&(
          <>
            <Dashboard foods={foods} workouts={workouts} cardio={cardio} weightLog={weightLog} goals={goals} setWeightLog={setWeightLog} ac={ac} streak={streak}/>
            {/* weekly summary card */}
            {weekDaysLogged>0&&(
              <div className="card" style={{marginTop:14,background:'linear-gradient(135deg,rgba(0,200,255,0.12) 0%,rgba(191,90,242,0.12) 100%)',border:`1px solid ${h(CYAN,0.25)}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span className="lbl" style={{marginBottom:0}}>this week</span>
                  {streak>0&&<span style={{fontSize:12,color:LIME,fontWeight:800}}>🔥 {streak} day streak</span>}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
                  {[['avg calories',weekAvgCal,'kcal/day',PINK],['sessions',weekWorkouts.length,'workouts',VIOLET],['days logged',weekDaysLogged,'/ 7',CYAN]].map(([l,v,u,c])=>(
                    <div key={l} style={{textAlign:'center',background:'rgba(6,6,18,0.5)',borderRadius:14,padding:'12px 6px'}}>
                      <div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div>
                      <div style={{fontSize:10,color:MU,fontWeight:600,marginTop:2}}>{l}</div>
                      <div style={{fontSize:10,color:DIM,fontWeight:500}}>{u}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
        {tab==='train'&&<TrainTab workouts={workouts} setWorkouts={setWorkouts} templates={templates} setTemplates={setTemplates}/>}
        {tab==='cardio'&&<CardioLog cardio={cardio} setCardio={setCardio} weightLog={weightLog}/>}
        {tab==='food'&&<FoodTab foods={foods} setFoods={setFoods} savedMeals={savedMeals} setSavedMeals={setSavedMeals}/>}
        {tab==='progress'&&<ProgressTab foods={foods} workouts={workouts} weightLog={weightLog} goals={goals} ac={ac}/>}
        {tab==='settings'&&<SettingsTab goals={goals} setGoals={setGoals} ac={ac}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
