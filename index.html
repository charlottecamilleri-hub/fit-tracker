<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.1.1/index.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08080F}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;color:#F0F0FF}
#root{max-width:680px;margin:0 auto}
input,textarea,select{font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;color:#F0F0FF;background:#181828;border:0.5px solid rgba(255,255,255,0.09);border-radius:12px;padding:10px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(255,255,255,0.06)}
select option{background:#0F0F1C;color:#F0F0FF}
textarea{resize:vertical}
button{font-family:'Space Grotesk',system-ui,sans-serif;cursor:pointer;border:none;background:none;color:#F0F0FF;padding:0;font-size:14px;font-weight:500}
button:active{transform:scale(0.97)}
.btn{border:0.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 18px;background:#181828;color:#F0F0FF;transition:background 0.12s}
.btn:hover{background:#20202E}
.btn:disabled{opacity:0.28;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:#6A6A90}
.btn.ghost:hover{color:#F0F0FF;background:rgba(255,255,255,0.05)}
.btn.dng{color:#FF6B6B;border-color:rgba(255,107,107,0.2);background:transparent}
.btn.dng:hover{background:rgba(255,107,107,0.07)}
.card{background:#0F0F1C;border:0.5px solid rgba(255,255,255,0.07);border-radius:20px;padding:1.25rem 1.4rem}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;background:#181828;color:#6A6A90}
.lbl{font-size:11px;font-weight:600;color:#454560;text-transform:uppercase;letter-spacing:0.09em;display:block;margin-bottom:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#20203A;border:none;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;border:3px solid #08080F}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:3px solid #08080F;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const BG='#08080F',SF='#0F0F1C',RZ='#181828';
const BDR='rgba(255,255,255,0.07)';
const TX='#F0F0FF',MU='#6A6A90',DIM='#20203A';
const CORAL='#FF6B6B',BLUE='#4D9EFF',AMBER='#FFB347',PURPLE='#9B7BFF',MINT='#00D4A0';
const ACCENTS={mint:'#00D4A0',coral:'#FF6B6B',blue:'#4D9EFF',purple:'#9B7BFF',gold:'#FFB347',rose:'#FF6B9D'};
const DG={calories:2000,protein:140,carbs:200,fat:65,name:'',accent:'mint',appName:'My Tracker'};
const MG=['chest','back','shoulders','biceps','triceps','legs','glutes','core','cardio','full body'];
const tod=()=>new Date().toDateString();
const ds=ts=>new Date(ts).toDateString();
const h=(c,o=0.15)=>`${c}${Math.round(o*255).toString(16).padStart(2,'0')}`;

/* localStorage — AI_URL points to Netlify function on deploy */
const stor={
  get:k=>{try{const v=localStorage.getItem('fit_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem('fit_'+k,JSON.stringify(v));}catch{}}
};
const AI_URL='/.netlify/functions/estimate';
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
const validMT=t=>['image/jpeg','image/png','image/gif','image/webp'].includes(t)?t:'image/jpeg';

function calcStreak(foods){
  let s=0;
  for(let i=0;i<365;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    if(foods.some(f=>ds(f.ts)===d.toDateString()))s++;
    else break;
  }
  return s;
}

function Ring({consumed,goal,ac}){
  const r=72,cx=90,cy=90,circ=2*Math.PI*r;
  const pct=Math.min(1,consumed/goal),over=consumed>goal,color=over?CORAL:ac;
  return(
    <svg width="180" height="180" viewBox="0 0 180 180" style={{display:'block',margin:'0 auto'}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={DIM} strokeWidth="8"/>
      {consumed>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}/>}
      <text x={cx} y={cy-14} textAnchor="middle" fill={TX} fontSize="38" fontWeight="700" fontFamily="Space Grotesk">{Math.round(consumed)}</text>
      <text x={cx} y={cy+8} textAnchor="middle" fill={MU} fontSize="12" fontFamily="Space Grotesk">kcal eaten</text>
      <text x={cx} y={cy+26} textAnchor="middle" fill={color} fontSize="13" fontWeight="600" fontFamily="Space Grotesk">
        {over?`${Math.round(consumed-goal)} over`:`${Math.round(goal-consumed)} to go`}
      </text>
    </svg>
  );
}

function MB({label,val,goal,color}){
  const pct=Math.min(100,Math.round(val/goal*100));
  return(
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:7}}>
        <span style={{fontSize:11,fontWeight:600,color:MU,textTransform:'uppercase',letterSpacing:'0.08em'}}>{label}</span>
        <div style={{display:'flex',alignItems:'baseline',gap:3}}>
          <span style={{fontSize:17,fontWeight:700,color:TX}}>{Math.round(val)}</span>
          <span style={{fontSize:12,color:MU,fontWeight:400}}>/{goal}g</span>
        </div>
      </div>
      <div style={{height:6,borderRadius:3,background:DIM}}>
        <div style={{height:'100%',borderRadius:3,background:color,width:`${pct}%`,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}

function NG({calories,protein,carbs,fat}){
  return(
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:16}}>
      {[['kcal',Math.round(calories),CORAL],['P',Math.round(protein),MINT],['C',Math.round(carbs),BLUE],['F',Math.round(fat),AMBER]].map(([l,v,c])=>(
        <div key={l} style={{textAlign:'center',background:RZ,borderRadius:12,padding:'10px 0',border:`0.5px solid ${h(c,0.2)}`}}>
          <div style={{fontSize:17,fontWeight:700,color:c}}>{v}</div>
          <div style={{fontSize:11,color:MU,marginTop:2,fontWeight:500}}>{l}</div>
        </div>
      ))}
    </div>
  );
}

function WeekBars({foods,goal,ac}){
  const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
  const data=days.map(d=>({lbl:d.toLocaleDateString('en',{weekday:'narrow'}),cal:foods.filter(f=>ds(f.ts)===d.toDateString()).reduce((s,f)=>s+f.calories,0),now:d.toDateString()===tod()}));
  const mx=Math.max(goal*1.3,...data.map(d=>d.cal),1),H=90,bw=28,gap=12;
  return(
    <svg viewBox={`0 0 280 ${H+22}`} width="100%">
      <line x1="0" y1={H-(goal/mx)*H} x2="280" y2={H-(goal/mx)*H} stroke={ac} strokeWidth="1" strokeDasharray="4,3" opacity="0.25"/>
      {data.map((d,i)=>{const x=i*(bw+gap)+4,hh=Math.round((d.cal/mx)*H),over=d.cal>goal;return(
        <g key={i}>
          <rect x={x} y={0} width={bw} height={H} fill={DIM} rx="6"/>
          {d.cal>0&&<rect x={x} y={H-hh} width={bw} height={hh} fill={over?CORAL:ac} rx="6" opacity={d.now?1:0.55}/>}
          <text x={x+bw/2} y={H+15} textAnchor="middle" fill={d.now?TX:MU} fontSize="10" fontWeight={d.now?'700':'400'}>{d.lbl}</text>
        </g>
      );})}
    </svg>
  );
}

function WtLine({log}){
  if(log.length<2)return<p style={{color:MU,fontSize:13,textAlign:'center',padding:'1.5rem 0',fontStyle:'italic'}}>log 2+ entries to see your trend</p>;
  const pts=[...log].sort((a,b)=>a.ts-b.ts).slice(-14);
  const ws=pts.map(e=>e.weight),mn=Math.min(...ws)-0.5,mx=Math.max(...ws)+0.5,W=272,H=80;
  const c=pts.map((e,i)=>({x:(i/(pts.length-1))*(W-16)+8,y:H-((e.weight-mn)/(mx-mn))*(H-12)-6}));
  return(
    <svg viewBox={`0 0 ${W} ${H+20}`} width="100%">
      <polyline points={c.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke={BLUE} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {c.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={i===c.length-1?5:3} fill={BLUE} opacity={i===c.length-1?1:0.5}/>)}
      <text x="8" y={H+16} fill={MU} fontSize="10">{new Date(pts[0].ts).toLocaleDateString('en',{day:'numeric',month:'short'})}</text>
      <text x={W-8} y={H+16} fill={MU} fontSize="10" textAnchor="end">{new Date(pts[pts.length-1].ts).toLocaleDateString('en',{day:'numeric',month:'short'})}</text>
    </svg>
  );
}

function Onboarding({onComplete}){
  const[name,setName]=useState('');
  const[loc,setLoc]=useState({calories:2000,protein:140,carbs:200,fat:65});
  const flds=[['calories','daily calories','kcal',1000,4000,50,CORAL],['protein','protein goal','g',40,300,5,MINT],['carbs','carbs goal','g',50,500,5,BLUE],['fat','fat goal','g',20,150,5,AMBER]];
  return(
    <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column',justifyContent:'center',padding:'2rem 1.25rem'}}>
      <div style={{marginBottom:'2rem'}}>
        <p style={{fontSize:28,fontWeight:700,color:TX,marginBottom:6}}>welcome 👋</p>
        <p style={{fontSize:15,color:MU}}>let's get your tracker set up in 30 seconds.</p>
      </div>
      <div className="card" style={{marginBottom:14}}>
        <span className="lbl">your name</span>
        <input placeholder="e.g. Charlotte" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&name.trim()&&onComplete(name.trim(),loc)}/>
      </div>
      <div className="card" style={{marginBottom:14}}>
        <span className="lbl">daily targets</span>
        {flds.map(([k,lb,u,mn,mx,st,c])=>(
          <div key={k} style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <label style={{fontSize:13,color:MU,fontWeight:500}}>{lb}</label>
              <span style={{fontSize:15,fontWeight:700,color:c}}>{loc[k]}<span style={{fontSize:12,color:MU,fontWeight:400}}> {u}</span></span>
            </div>
            <input type="range" min={mn} max={mx} step={st} value={loc[k]} style={{accentColor:c}} onChange={e=>setLoc(l=>({...l,[k]:+e.target.value}))}/>
          </div>
        ))}
      </div>
      <button onClick={()=>onComplete(name.trim(),loc)} disabled={!name.trim()}
        style={{width:'100%',padding:'14px',borderRadius:14,border:'none',background:MINT,color:'#08080F',fontSize:16,fontWeight:700,opacity:name.trim()?1:0.3}}>
        get started <i className="ti ti-arrow-right" style={{marginLeft:4,verticalAlign:-2}}/>
      </button>
    </div>
  );
}

function FoodEntry({f,onDelete,onEdit}){
  const[mode,setMode]=useState('view');
  const[v,setV]=useState({...f});
  const[confirmDel,setConfirmDel]=useState(false);
  if(confirmDel)return(
    <div style={{background:h(CORAL,0.08),borderRadius:12,padding:'12px 14px',marginBottom:10,border:`0.5px solid ${h(CORAL,0.2)}`}}>
      <p style={{fontSize:13,color:TX,fontWeight:500,marginBottom:10}}>Delete <span style={{color:CORAL}}>{f.name.length>35?f.name.slice(0,35)+'...':f.name}</span>?</p>
      <div style={{display:'flex',gap:8}}>
        <button className="btn sm dng" style={{fontWeight:700}} onClick={()=>onDelete(f.id)}>yes, delete</button>
        <button className="btn sm ghost" onClick={()=>setConfirmDel(false)}>cancel</button>
      </div>
    </div>
  );
  if(mode==='edit')return(
    <div style={{borderBottom:`0.5px solid ${BDR}`,paddingBottom:14,marginBottom:14}}>
      <input value={v.name} onChange={e=>setV({...v,name:e.target.value})} style={{marginBottom:10}}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
        {[['calories','kcal',CORAL],['protein','g',MINT],['carbs','g',BLUE],['fat','g',AMBER]].map(([k,u,c])=>(
          <div key={k}>
            <label style={{fontSize:11,color:c,fontWeight:600,display:'block',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>{k} ({u})</label>
            <input type="number" value={v[k]} min={0} onChange={e=>setV({...v,[k]:+e.target.value})}/>
          </div>
        ))}
      </div>
      <input value={v.serving} onChange={e=>setV({...v,serving:e.target.value})} placeholder="serving description" style={{marginBottom:10}}/>
      <div style={{display:'flex',gap:8}}>
        <button className="btn sm" style={{flex:1,background:MINT,color:'#08080F',border:'none',fontWeight:700}} onClick={()=>{onEdit(v);setMode('view');}}>save changes</button>
        <button className="btn sm ghost" onClick={()=>{setV({...f});setMode('view');}}>cancel</button>
      </div>
    </div>
  );
  return(
    <div style={{borderBottom:`0.5px solid ${BDR}`,paddingBottom:10,marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
        <p style={{color:TX,fontWeight:600,flex:1,marginRight:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:14}}>{f.name}</p>
        <div style={{display:'flex',gap:4,flexShrink:0}}>
          <button className="btn ghost sm" style={{padding:'2px 7px'}} onClick={()=>setMode('edit')}><i className="ti ti-edit" style={{fontSize:12}}/></button>
          <button className="btn dng sm" style={{padding:'2px 7px'}} onClick={()=>setConfirmDel(true)}><i className="ti ti-trash" style={{fontSize:12}}/></button>
        </div>
      </div>
      <div style={{display:'flex',gap:12,fontSize:12}}>
        <span style={{color:CORAL,fontWeight:700}}>{Math.round(f.calories)}<span style={{color:MU,fontWeight:400}}> kcal</span></span>
        <span style={{color:MINT,fontWeight:600}}>{Math.round(f.protein)}g P</span>
        <span style={{color:BLUE,fontWeight:600}}>{Math.round(f.carbs)}g C</span>
        <span style={{color:AMBER,fontWeight:600}}>{Math.round(f.fat)}g F</span>
      </div>
      <p style={{fontSize:11,color:DIM,marginTop:3,fontStyle:'italic'}}>{f.serving}</p>
    </div>
  );
}

function Dashboard({foods,workouts,weightLog,goals,setWeightLog,ac,streak}){
  const[wi,setWi]=useState('');
  const tf=foods.filter(f=>ds(f.ts)===tod());
  const tot=tf.reduce((a,f)=>({cal:a.cal+f.calories,pro:a.pro+f.protein,carbs:a.carbs+f.carbs,fat:a.fat+f.fat}),{cal:0,pro:0,carbs:0,fat:0});
  const tw=workouts.filter(w=>ds(w.ts)===tod());
  const lw=[...weightLog].sort((a,b)=>b.ts-a.ts)[0]?.weight;
  const logW=()=>{const w=parseFloat(wi);if(!w||w<20||w>300)return;setWeightLog(l=>[...l,{id:Date.now(),ts:Date.now(),weight:w}]);setWi('');};
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 2px',marginBottom:2}}>
        <p style={{fontSize:18,fontWeight:700,color:TX}}>hey, {goals.name} 👋</p>
        {streak>0&&(
          <div style={{display:'flex',alignItems:'center',gap:5,background:h(ac,0.12),padding:'5px 12px',borderRadius:100,border:`0.5px solid ${h(ac,0.25)}`}}>
            <i className="ti ti-flame" style={{fontSize:14,color:ac}}/>
            <span style={{fontSize:12,fontWeight:700,color:ac}}>{streak} day{streak!==1?'s':''}</span>
          </div>
        )}
      </div>
      <div className="card" style={{textAlign:'center',paddingTop:'1.5rem',paddingBottom:'1.5rem'}}>
        <Ring consumed={tot.cal} goal={goals.calories} ac={ac}/>
        <div style={{height:1,background:BDR,margin:'1.25rem 0'}}/>
        <MB label="protein" val={tot.pro} goal={goals.protein} color={MINT}/>
        <MB label="carbs" val={tot.carbs} goal={goals.carbs} color={BLUE}/>
        <MB label="fat" val={tot.fat} goal={goals.fat} color={AMBER}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
        {[['remaining',Math.max(0,goals.calories-Math.round(tot.cal)),'kcal',CORAL],['sessions',tw.length,'today',PURPLE],['weight',lw??'--','kg',BLUE]].map(([l,v,u,c])=>(
          <div key={l} style={{background:SF,border:`0.5px solid ${BDR}`,borderRadius:16,padding:'14px 8px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:700,color:c}}>{v}</div>
            <div style={{fontSize:11,color:MU,marginTop:3,fontWeight:500}}>{l}</div>
            <div style={{fontSize:10,color:DIM}}>{u}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <span className="lbl">log weight</span>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input type="number" placeholder="e.g. 72.5" value={wi} onChange={e=>setWi(e.target.value)} onKeyDown={e=>e.key==='Enter'&&logW()} step="0.1" style={{flex:1}}/>
          <span style={{color:MU,fontSize:13,whiteSpace:'nowrap',fontWeight:500}}>kg</span>
          <button className="btn sm" style={{background:ac,color:'#08080F',border:'none',fontWeight:700}} onClick={logW} disabled={!wi}>log</button>
        </div>
      </div>
      {tf.length>0&&(
        <div className="card" style={{borderLeft:`3px solid ${CORAL}`}}>
          <span className="lbl">food today</span>
          {tf.slice(-5).map(f=>(
            <div key={f.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,paddingBottom:8,marginBottom:8,borderBottom:`0.5px solid ${BDR}`}}>
              <span style={{color:TX,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,marginRight:8,fontWeight:600}}>{f.name}</span>
              <span style={{color:CORAL,fontWeight:700,whiteSpace:'nowrap'}}>{Math.round(f.calories)}<span style={{color:MU,fontWeight:400,fontSize:11}}> kcal</span></span>
            </div>
          ))}
          {tf.length>5&&<p style={{fontSize:12,color:MU,textAlign:'center'}}>+{tf.length-5} more</p>}
        </div>
      )}
      {tw.length>0&&(
        <div className="card" style={{borderLeft:`3px solid ${PURPLE}`}}>
          <span className="lbl">training today</span>
          {tw.map(w=>(
            <div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:14,marginBottom:8}}>
              <span style={{color:TX,fontWeight:600}}>{w.exercise}</span>
              <div style={{display:'flex',gap:5}}>
                <span className="pill" style={{background:h(PURPLE,0.15),color:PURPLE}}>{w.muscle}</span>
                <span className="pill">{w.sets.length}s</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TrainTab({workouts,setWorkouts,templates,setTemplates,ac}){
  const[ex,setEx]=useState('');const[ms,setMs]=useState('chest');
  const[sets,setSets]=useState([{reps:10,weight:60}]);
  const[notes,setNotes]=useState('');const[showT,setShowT]=useState(false);
  const[tName,setTName]=useState('');const[savT,setSavT]=useState(false);
  const[delConfirm,setDelConfirm]=useState(null);
  const tw=workouts.filter(w=>ds(w.ts)===tod());
  const addS=()=>setSets(s=>[...s,{...s[s.length-1]}]);
  const upd=(i,f,v)=>setSets(s=>s.map((x,j)=>j===i?{...x,[f]:v}:x));
  const rmS=i=>setSets(s=>s.filter((_,j)=>j!==i));
  const save=()=>{if(!ex.trim())return;setWorkouts(w=>[...w,{id:Date.now(),ts:Date.now(),exercise:ex.trim(),muscle:ms,sets:[...sets],notes}]);setEx('');setSets([{reps:10,weight:60}]);setNotes('');};
  const saveTpl=()=>{if(!tName.trim()||!ex.trim())return;setTemplates(t=>[...t,{id:Date.now(),name:tName.trim(),exercise:ex,muscle:ms,sets:[...sets]}]);setTName('');setSavT(false);};
  const loadT=t=>{setEx(t.exercise);setMs(t.muscle);setSets([...t.sets]);setShowT(false);};
  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {templates.length>0&&(
        <div>
          <button className="btn ghost sm" style={{color:PURPLE}} onClick={()=>setShowT(s=>!s)}>
            <i className="ti ti-template" style={{marginRight:5,fontSize:14,verticalAlign:-2}}/>{showT?'hide templates':'load template'}
          </button>
          {showT&&(
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
              {templates.map(t=>(

function OFFSearch({onAdd}){
  const[q,setQ]=useState('');const[load,setLoad]=useState(false);
  const[res,setRes]=useState([]);const[sel,setSel]=useState(null);
  const[qty,setQty]=useState(100);const[err,setErr]=useState('');
  const isBC=s=>/^\d{6,14}$/.test(s.trim());
  const nut=(p,g)=>{const n=p.nutriments||{},f=g/100;return{calories:Math.round((n['energy-kcal_100g']||n['energy-kcal']||0)*f),protein:Math.round((n['proteins_100g']||n.proteins||0)*f*10)/10,carbs:Math.round((n['carbohydrates_100g']||n.carbohydrates||0)*f*10)/10,fat:Math.round((n['fat_100g']||n.fat||0)*f*10)/10};};
  const search=useCallback(async()=>{
    if(!q.trim())return;setLoad(true);setErr('');setRes([]);setSel(null);
    try{
      if(isBC(q)){const r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${q.trim()}.json`);const d=await r.json();if(d.status===1&&d.product)setRes([d.product]);else setErr('Barcode not found.');}
      else{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&json=1&page_size=8&action=process`);const d=await r.json();const v=(d.products||[]).filter(p=>p.nutriments&&p.product_name).slice(0,6);v.length?setRes(v):setErr('Nothing found. Try a barcode.');}
    }catch{setErr('Could not reach Open Food Facts.');}
    setLoad(false);
  },[q]);
  const doAdd=()=>{if(!sel)return;const n=nut(sel,qty);onAdd({id:Date.now(),ts:Date.now(),source:'off',name:sel.product_name||'Product',serving:`${qty}g`,...n});setQ('');setRes([]);setSel(null);setQty(100);};
  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input value={q} onChange={e=>{setQ(e.target.value);setSel(null);setRes([]);}} onKeyDown={e=>e.key==='Enter'&&search()} placeholder="Product name or barcode number"/>
        <button className="btn sm" style={{background:BLUE,color:'#fff',border:'none',fontWeight:700,flexShrink:0,minWidth:42}} onClick={search} disabled={load||!q.trim()}>{load?<i className="ti ti-loader-2"/>:<i className="ti ti-search"/>}</button>
      </div>
      {err&&<p style={{fontSize:13,color:CORAL,marginBottom:10,fontWeight:500}}>{err}</p>}
      {!sel&&res.length>0&&(<div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:12}}>
        {res.map((p,i)=>{const n=nut(p,100);return(<button key={i} className="btn" style={{textAlign:'left',padding:'10px 14px'}} onClick={()=>setSel(p)}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{flex:1,minWidth:0}}><p style={{fontSize:14,color:TX,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.product_name}</p>{p.brands&&<p style={{fontSize:11,color:MU,marginTop:1}}>{p.brands}</p>}</div>
            <div style={{display:'flex',gap:5,marginLeft:8,flexShrink:0}}>
              <span className="pill" style={{color:CORAL,background:h(CORAL,0.12),fontWeight:700}}>{n.calories}kcal</span>
              <span className="pill" style={{color:MINT,background:h(MINT,0.12),fontWeight:700}}>{n.protein}g P</span>
            </div>
          </div>
        </button>);})}
      </div>)}
      {sel&&(<div style={{background:RZ,borderRadius:14,padding:'14px 16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div><p style={{fontWeight:700,fontSize:15,color:TX}}>{sel.product_name}</p>{sel.brands&&<p style={{fontSize:11,color:MU,marginTop:2}}>{sel.brands}</p>}</div>
          <button className="btn ghost sm" onClick={()=>setSel(null)}>change</button>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
          <label style={{fontSize:13,color:MU,whiteSpace:'nowrap',fontWeight:500}}>serving</label>
          <input type="number" value={qty} min={1} step={5} onChange={e=>setQty(+e.target.value)} style={{width:80,textAlign:'center'}}/>
          <span style={{fontSize:13,color:MU,fontWeight:500}}>g</span>
        </div>
        <NG {...nut(sel,qty)}/>
        <button className="btn" style={{width:'100%',background:CORAL,color:'#fff',border:'none',fontWeight:700}} onClick={doAdd}>add to log</button>
      </div>)}
    </div>
  );
}

function AIEst({onAdd}){
  const[q,setQ]=useState('');const[load,setLoad]=useState(false);const[res,setRes]=useState(null);const[err,setErr]=useState('');
  const run=useCallback(async()=>{
    if(!q.trim())return;setLoad(true);setErr('');setRes(null);
    try{
      const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,system:'You are a nutrition expert. Return ONLY raw JSON, no markdown: {name:string,calories:number,protein:number,carbs:number,fat:number,serving:string}',messages:[{role:'user',content:q}]})});
      const d=await r.json();setRes(JSON.parse((d.content?.[0]?.text||'').replace(/```json|```/g,'').trim()));
    }catch{setErr('Could not estimate. Try being more specific.');}
    setLoad(false);
  },[q]);
  const doAdd=()=>{if(!res)return;onAdd({id:Date.now(),ts:Date.now(),source:'ai',...res});setQ('');setRes(null);};
  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:res?12:0}}>

        <button className="btn sm" style={{background:CORAL,color:'#fff',border:'none',fontWeight:700,alignSelf:'flex-start',flexShrink:0}} onClick={run} disabled={load||!q.trim()}>{load?<i className="ti ti-loader-2"/>:'go'}</button>

        <button className="btn" style={{width:'100%',background:CORAL,color:'#fff',border:'none',fontWeight:700}} onClick={doAdd}>add to log</button>
      </div>)}
    </div>
  );
}

function PhotoEst({onAdd}){

  const handleFile=e=>{const f=e.target.files[0];if(!f)return;setFile(f);setRes(null);setErr('');const r=new FileReader();r.onload=()=>setPreview(r.result);r.readAsDataURL(f);};
  const reset=()=>{setFile(null);setPreview(null);setRes(null);setErr('');};
  const run=async()=>{
    if(!file)return;setLoad(true);setErr('');setRes(null);

      const b64=await toB64(file);

      const d=await r.json();setRes(JSON.parse((d.content?.[0]?.text||'').replace(/```json|```/g,'').trim()));
    }catch{setErr('Could not analyse photo. Try a clearer shot.');}

            <i className="ti ti-camera" style={{fontSize:36,color:MINT,display:'block',marginBottom:8}}/>

            <img src={preview} alt="food" style={{width:'100%',borderRadius:14,maxHeight:220,objectFit:'cover',display:'block'}}/>
            <button onClick={reset} style={{position:'absolute',top:8,right:8,background:'rgba(8,8,15,0.85)',border:'none',color:TX,borderRadius:10,padding:'6px 12px',fontSize:12,fontWeight:600}}>
              <i className="ti ti-refresh" style={{marginRight:4,fontSize:12,verticalAlign:-1}}/>retake
            </button>
          </div>
          {!res&&(<button className="btn" style={{width:'100%',background:MINT,color:'#08080F',border:'none',fontWeight:700}} onClick={run} disabled={load}>
            {load?<><i className="ti ti-loader-2" style={{marginRight:6}}/>analysing...</>:<><i className="ti ti-sparkles" style={{marginRight:6,fontSize:14,verticalAlign:-2}}/>analyse photo</>}
          </button>)}
        </div>
      )}
      {err&&<p style={{fontSize:13,color:CORAL,marginTop:10,fontWeight:500}}>{err}</p>}
      {res&&(<div style={{marginTop:12,background:RZ,borderRadius:14,padding:'14px 16px'}}>
        <p style={{fontWeight:700,fontSize:15,color:TX,marginBottom:3}}>{res.name}</p>
        <p style={{fontSize:12,color:MU,marginBottom:12,fontStyle:'italic'}}>{res.serving}</p>
        <NG calories={res.calories} protein={res.protein} carbs={res.carbs} fat={res.fat}/>
        <div style={{display:'flex',gap:8}}>
          <button className="btn" style={{flex:1,background:CORAL,color:'#fff',border:'none',fontWeight:700}} onClick={doAdd}>add to log</button>
          <button className="btn sm ghost" onClick={reset}>retake</button>
        </div>

  );

          <input value={loc.name||''} onChange={e=>setLoc(l=>({...l,name:e.target.value}))} placeholder="Your name"/>
        </div>
        <div>
          <label style={{fontSize:13,color:MU,fontWeight:500,display:'block',marginBottom:6}}>app name</label>
          <input value={loc.appName||''} onChange={e=>setLoc(l=>({...l,appName:e.target.value}))} placeholder="e.g. My Tracker"/>
        </div>
      </div>
      <div className="card">
        <span className="lbl">accent colour</span>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {accentOptions.map(([key,c])=>(
            <button key={key} onClick={()=>setLoc(l=>({...l,accent:key}))} style={{
              width:44,height:44,borderRadius:'50%',background:c,border:'none',
              outline:loc.accent===key?`3px solid ${TX}`:'3px solid transparent',
              outlineOffset:2,transition:'outline 0.15s',display:'flex',alignItems:'center',justifyContent:'center'
            }}>
              {loc.accent===key&&<i className="ti ti-check" style={{fontSize:18,color:'#08080F'}}/>}
            </button>
          ))}
        </div>
      </div>
      <div className="card">
        <span className="lbl">daily targets</span>
        {flds.map(([k,lb,u,mn,mx,st,c])=>(
          <div key={k} style={{marginBottom:22}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:14,marginBottom:10}}>
              <label style={{color:MU,fontWeight:500}}>{lb}</label>
              <span style={{color:c,fontWeight:700,fontSize:16}}>{loc[k]}<span style={{fontSize:12,color:MU,fontWeight:400}}> {u}</span></span>
            </div>
            <input type="range" min={mn} max={mx} step={st} value={loc[k]} style={{accentColor:c}} onChange={e=>setLoc(l=>({...l,[k]:+e.target.value}))}/>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:DIM,marginTop:5,fontWeight:500}}><span>{mn}</span><span>{mx}</span></div>
          </div>
        ))}
        <button className="btn" style={{width:'100%',background:ac,color:'#08080F',border:'none',fontWeight:700}} onClick={save}>
          {ok?<><i className="ti ti-check" style={{marginRight:5}}/>saved!</>:'save changes'}
        </button>
      </div>
      <div className="card">
        <span className="lbl">about</span>
        <p style={{fontSize:13,color:MU,lineHeight:1.8}}>Food data: <span style={{color:MINT,fontWeight:600}}>Open Food Facts</span> (open source, free). AI estimates and photo analysis: <span style={{color:PURPLE,fontWeight:600}}>Claude Sonnet</span>. Data saved to your browser's local storage.</p>
      </div>
    </div>
  );
}

function App(){
  const[tab,setTab]=useState('home');const[rdy,setRdy]=useState(false);
  const[foods,setFoods]=useState([]);const[workouts,setWorkouts]=useState([]);
  const[weightLog,setWeightLog]=useState([]);const[templates,setTemplates]=useState([]);
  const[goals,setGoals]=useState(DG);
  useEffect(()=>{
    const f=stor.get('foods'),w=stor.get('workouts'),wl=stor.get('wt'),t=stor.get('tpls'),g=stor.get('goals');
    if(f)setFoods(f);if(w)setWorkouts(w);if(wl)setWeightLog(wl);if(t)setTemplates(t);if(g)setGoals(g);
    setRdy(true);
  },[]);
  useEffect(()=>{if(rdy)stor.set('foods',foods);},[foods,rdy]);
  useEffect(()=>{if(rdy)stor.set('workouts',workouts);},[workouts,rdy]);
  useEffect(()=>{if(rdy)stor.set('wt',weightLog);},[weightLog,rdy]);
  useEffect(()=>{if(rdy)stor.set('tpls',templates);},[templates,rdy]);
  useEffect(()=>{if(rdy)stor.set('goals',goals);},[goals,rdy]);

  const ac=ACCENTS[goals.accent]||MINT;
  const streak=calcStreak(foods);
  const appName=goals.appName||'My Tracker';
  const NAV=[['home','ti-layout-dashboard',ac],['train','ti-barbell',PURPLE],['food','ti-salad',CORAL],['progress','ti-chart-line',BLUE],['settings','ti-settings',AMBER]];

  if(!rdy)return<div style={{background:BG,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><p style={{color:MU,fontSize:14,fontWeight:500}}>loading...</p></div>;
  if(!goals.name)return<Onboarding onComplete={(name,newGoals)=>setGoals(g=>({...g,...newGoals,name}))}/>;

  return(
    <div style={{background:BG,minHeight:'100vh'}}>
      <nav style={{position:'sticky',top:0,zIndex:10,background:'rgba(8,8,15,0.97)',borderBottom:`0.5px solid ${BDR}`,padding:'6px 0 4px'}}>
        <p style={{textAlign:'center',fontSize:12,fontWeight:700,color:MU,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:6}}>{appName}</p>
        <div style={{display:'flex',justifyContent:'space-around',maxWidth:680,margin:'0 auto'}}>
          {NAV.map(([id,ic,color])=>(
            <button key={id} onClick={()=>setTab(id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:1,color:tab===id?color:MU,padding:'2px 10px'}}>
              <div style={{padding:'5px 10px',borderRadius:12,background:tab===id?h(color,0.15):'transparent',transition:'all 0.15s'}}>
                <i className={`ti ${ic}`} style={{fontSize:21,display:'block'}}/>
              </div>
              <span style={{fontSize:10,fontWeight:tab===id?700:400,letterSpacing:'0.02em'}}>{id}</span>
            </button>
          ))}
        </div>
      </nav>
      <div style={{maxWidth:680,margin:'0 auto',padding:'1rem 1rem 4rem'}}>
        {tab==='home'&&<Dashboard foods={foods} workouts={workouts} weightLog={weightLog} goals={goals} setWeightLog={setWeightLog} ac={ac} streak={streak}/>}
        {tab==='train'&&<TrainTab workouts={workouts} setWorkouts={setWorkouts} templates={templates} setTemplates={setTemplates} ac={ac}/>}
        {tab==='food'&&<FoodTab foods={foods} setFoods={setFoods}/>}
        {tab==='progress'&&<ProgressTab foods={foods} workouts={workouts} weightLog={weightLog} goals={goals} ac={ac}/>}
        {tab==='settings'&&<SettingsTab goals={goals} setGoals={setGoals} ac={ac}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
